project_id = "bloodlink"

# -------------------------------------------------------------------
# API
# -------------------------------------------------------------------
[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

# -------------------------------------------------------------------
# Database
# -------------------------------------------------------------------
[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329

# -------------------------------------------------------------------
# Studio (local GUI)
# -------------------------------------------------------------------
[studio]
enabled = true
port = 54323

# -------------------------------------------------------------------
# Auth
# -------------------------------------------------------------------
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = true
enable_confirmations = true
template = "Your BloodLink code is {{ .Code }}"

# -------------------------------------------------------------------
# Realtime
# -------------------------------------------------------------------
[realtime]
enabled = true

# -------------------------------------------------------------------
# Storage
# -------------------------------------------------------------------
[storage]
enabled = true
file_size_limit = "5MiB"

# -------------------------------------------------------------------
# Edge Functions
# -------------------------------------------------------------------
[functions.notify-donors]
verify_jwt = false

[functions.expire-requests]
verify_jwt = false
# Cron schedule is configured separately via pg_cron after deploy
# (see SETUP.md §11). Keeping it here is no longer supported by the CLI.

[functions.award-points]
verify_jwt = false

# -------------------------------------------------------------------
# Analytics
# -------------------------------------------------------------------
[analytics]
enabled = false
